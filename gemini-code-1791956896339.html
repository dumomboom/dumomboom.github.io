<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전체 실시간 광장 채팅</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .chat-container { width: 100%; max-width: 450px; height: 90vh; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
    .chat-header { background: #4f46e5; color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
    .chat-header h2 { font-size: 1.1rem; font-weight: 600; }
    .user-info { font-size: 0.85rem; opacity: 0.9; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 12px; }
    .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #f8fafc; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
    .message.my-msg { align-self: flex-end; background: #4f46e5; color: white; border-bottom-right-radius: 2px; }
    .message.other-msg { align-self: flex-start; background: #ffffff; color: #1e293b; border-bottom-left-radius: 2px; border: 1px solid #e2e8f0; }
    .msg-author { font-size: 0.75rem; margin-bottom: 4px; font-weight: 600; color: #64748b; }
    .my-msg .msg-author { color: #c7d2fe; }
    .msg-time { font-size: 0.68rem; color: #94a3b8; margin-top: 4px; text-align: right; }
    .my-msg .msg-time { color: #e0e7ff; }
    .chat-input-area { padding: 12px 16px; border-top: 1px solid #e2e8f0; display: flex; gap: 8px; background: #ffffff; }
    input[type="text"] { flex: 1; padding: 10px 16px; border: 1px solid #cbd5e1; border-radius: 20px; outline: none; font-size: 0.95rem; }
    input[type="text"]:focus { border-color: #4f46e5; }
    button { padding: 10px 18px; background: #4f46e5; color: white; border: none; border-radius: 20px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h2>전체 실시간 채널</h2>
      <span id="user-nickname" class="user-info">접속 중...</span>
    </div>
    <div class="chat-messages" id="messages"></div>
    <div class="chat-input-area">
      <input type="text" id="message-input" placeholder="메시지를 입력하세요..." onkeypress="handleKeyPress(event)" />
      <button onclick="sendMessage()">전송</button>
    </div>
  </div>

  <!-- Firebase SDK 로드 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 1. 본인의 Firebase 프로젝트 설정값으로 교체하세요.
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, 'global_chat');

    // 접속 사용자 닉네임 자동 생성 (로컬 스토리지 저장)
    let myNickname = localStorage.getItem('global_chat_nickname');
    if (!myNickname) {
      myNickname = '사용자_' + Math.floor(1000 + Math.random() * 9000);
      localStorage.setItem('global_chat_nickname', myNickname);
    }
    document.getElementById('user-nickname').innerText = myNickname;

    const messagesContainer = document.getElementById('messages');

    // 실시간 신규 메시지 수신 처리
    onChildAdded(messagesRef, (snapshot) => {
      const data = snapshot.val();
      appendMessage(data);
    });

    // 메시지 전송
    window.sendMessage = function() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      push(messagesRef, {
        nickname: myNickname,
        text: text,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });

      input.value = '';
    };

    window.handleKeyPress = function(e) {
      if (e.key === 'Enter') sendMessage();
    };

    function appendMessage(data) {
      const isMine = data.nickname === myNickname;
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${isMine ? 'my-msg' : 'other-msg'}`;
      
      msgDiv.innerHTML = `
        <div class="msg-author">${escapeHtml(data.nickname)}</div>
        <div>${escapeHtml(data.text)}</div>
        <div class="msg-time">${data.timestamp}</div>
      `;

      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
